<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ზმნისწინი</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Using a Google Font that supports Georgian characters well */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans Georgian', sans-serif;
            scroll-behavior: smooth;
        }
    </style>
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script type="text/babel">
        // All React components and application logic are now inside this single script tag.

        // --- Component: Card ---
        const Card = ({ title, children, className }) => {
            return (
                <section className={`bg-white rounded-xl shadow-lg p-6 sm:p-8 mb-8 ${className}`}>
                    <h2 className="text-2xl sm:text-3xl font-bold text-slate-800 mb-6 border-b-2 border-sky-200 pb-3">{title}</h2>
                    {children}
                </section>
            );
        };

        // --- Component: FunctionCard ---
        const FunctionCard = ({ icon, title, description }) => {
            return (
                <div className="bg-white rounded-xl shadow-lg p-6 flex items-start space-x-4 hover:shadow-xl hover:scale-105 transition-all duration-300">
                    <div className="flex-shrink-0 bg-slate-100 rounded-full p-3">
                        {icon}
                    </div>
                    <div>
                        <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                        <p className="text-slate-600">{description}</p>
                    </div>
                </div>
            );
        };

        // --- Component: PrefixList ---
        const PrefixList = ({ title, prefixes, color, icon }) => {
            const colorClasses = {
                blue: 'bg-blue-100 text-blue-800 border-blue-300',
                teal: 'bg-teal-100 text-teal-800 border-teal-300',
                indigo: 'bg-indigo-100 text-indigo-800 border-indigo-300',
                rose: 'bg-rose-100 text-rose-800 border-rose-300',
            };
            return (
                <div className="mb-6">
                    <h4 className="font-semibold text-lg mb-3 flex items-center gap-2">
                        {icon}
                        {title}
                    </h4>
                    <div className="flex flex-wrap gap-2">
                        {prefixes.map(prefix => (
                            <span key={prefix} className={`px-3 py-1 text-base font-medium rounded-md border ${colorClasses[color]}`}>
                                {prefix}
                            </span>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Component: AncientForms ---
        const AncientForms = () => {
            const forms = [
                { old: 'გან', modern: 'გა', examples: ['განმარტა', 'განმარტოვდა', 'განიცდის', 'განაგრძო', 'განრისხდა', 'განდგა...'] },
                { old: 'აღ', modern: 'ა', examples: ['აღნიშნა', 'აღზარდა', 'აღიარა', 'აღადგინა', 'აღმოაჩნა...'] },
                { old: 'წარ', modern: 'წა', examples: ['წარმოთქვა', 'წარmმოიდგინა', 'წარმოაჩინა', 'წარმოადგინა', 'წარმოიშვა...'] },
                { old: 'გარდა', modern: 'გადა', examples: ['გარდაიქმნა', 'გარდატეხა', 'გარდაიცვალა', 'გარდაისახა...'] },
                { old: 'შთა', modern: 'ჩა', examples: ['შთაინთქა', 'შთააგონა...'] },
            ];
            const FormRow = ({ form }) => (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-start py-4 border-b last:border-b-0">
                    <div className="flex items-center gap-4 font-mono text-xl justify-center md:justify-start">
                        <span className="font-bold text-red-600 bg-red-100 px-3 py-1 rounded">{form.old}</span>
                        <span className="text-gray-400">→</span>
                        <span className="font-bold text-green-600 bg-green-100 px-3 py-1 rounded">{form.modern}</span>
                    </div>
                    <div className="md:col-span-2 text-slate-700 leading-relaxed text-center md:text-left">
                        {form.examples.join(', ')}
                    </div>
                </div>
            );
            return (
                <Card title="ზმნისწინების ძველი ფორმები">
                    <p className="mb-4 text-slate-600">
                        რამდენიმე ზმნისწინი ძველად სხვა ფორმით გამოიყენებოდა, ახლა კი გამარტივებულია. ძველი ფორმები დღესაც გვხვდება ზმნებში:
                    </p>
                    <div className="bg-slate-50 rounded-lg p-2">
                        {forms.map(form => <FormRow key={form.old} form={form} />)}
                    </div>
                </Card>
            );
        };

        // --- Component: OrthographySection ---
        const OrthographySection = () => {
            const Rule = ({ children }) => (
                <div className="p-4 border-l-4 border-sky-300 bg-sky-50 rounded-r-lg mb-5">
                    {children}
                </div>
            );
            const Correct = ({ children }) => (
                <div className="flex items-start gap-2 mt-2">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-green-600 flex-shrink-0 mt-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                    </svg>
                    <span className="text-slate-700">{children}</span>
                </div>
            );
            const Incorrect = ({ children }) => (
                <div className="flex items-start gap-2 mt-2">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-red-600 flex-shrink-0 mt-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                    </svg>
                    <span className="text-slate-500 line-through">{children}</span>
                </div>
            );
            return (
                <Card title="მართლწერის საკითხები">
                    <Rule>
                        <p>» მიუღებელია ზმნისწინის ხმოვნების შეცვლა.</p>
                        <Incorrect>არ შეიძლება გამოვიყენოთ არც <span className="font-mono">მავიდა</span> და არც <span className="font-mono">მევიდა...</span></Incorrect>
                    </Rule>
                    <Rule>
                        <p>» ზმნისწინის ახალი სახეობების გვერდით სწორ ფორმად ითვლება ძველი სახეობებიც, ამიტომ ორივე ფორმა სწორია:</p>
                        <Correct>განათავისუფლებს – გაათავისუფლებს, განასახიერებს – გაასახიერებს, განაცხადებს – გააცხადებს, აღიმაღლებს – აიმაღლებს...</Correct>
                    </Rule>
                    <Rule>
                        <p>» თუ ზმნისწინის ძველი ფორმა დაერთვის ზმნას, მისი ჩამოშორებისას მთლიანად უნდა მოვაცილოთ ზმნისწინი:</p>
                        <Correct>ა<span className="font-bold text-sky-600">ღ</span>ზრდის – ზრდის</Correct>
                        <Incorrect>ღზრდის</Incorrect>
                        <Correct>გა<span className="font-bold text-sky-600">ნ</span>ათავისუფლებს – ათავისუფლებს</Correct>
                        <Incorrect>ანთავისუფლებს</Incorrect>
                    </Rule>
                    <Rule>
                        <p>» <span className="font-mono font-bold">აღ</span> ზმნისწინის დართვიასას პირველი სუბიექტური პირის ნიშანი ზმნისწინის შემდეგ უნდა გამოვიყენოთ და დავწეროთ:</p>
                        <Correct>ა<span className="font-bold text-sky-600">ღვ</span>ნიშნავ, ა<span className="font-bold text-sky-600">ღვ</span>წერე</Correct>
                        <Incorrect>ა<span className="font-bold text-red-500">ვღ</span>ნიშნავ, ა<span className="font-bold text-red-500">ვღ</span>წერე...</Incorrect>
                    </Rule>
                    <Rule>
                        <p>» არ შეიძლება ზმნისწინის გათიშვა და მასში პირის ნიშნის ჩართვა. თუ <span className="font-mono font-bold">გან</span> ზმნისწინს ვიყენებთ, პირის ნიშანი მის შემდეგ იქნება.</p>
                        <Correct>გა<span className="font-bold text-sky-600">ნმ</span>ათავისუფლეთ ან გა<span className="font-bold text-sky-600">მ</span>ათავისუფლეთ</Correct>
                        <Incorrect>გა<span className="font-bold text-red-500">მან</span>თავისუფლეთ</Incorrect>
                    </Rule>
                    <Rule>
                        <p>» უნდა დავუკვირდეთ <span className="font-mono font-bold">წარ</span> ზმნისწინიანი ფორმების სწორად გამოყენებას: თუ <span className="font-mono font-bold">წარ</span> ზმნისწინიან ფორმას ზმნისწინს ჩამოვაშორებთ, არ შეიძლება <span className="font-mono font-bold">რ</span> ბგერა ზმნის ფუძეში დავტოვოთ:</p>
                        <Correct>წა<span className="font-bold text-sky-600">რ</span>დგენა – წა<span className="font-bold text-sky-600">რვ</span>ადგენ ან ვადგენ. უმჯობესია, ეს ზმნა ზმნისწინით გამოვიყენოთ, რათა მნიშვნელობა ბუნდოვანი არ იყოს.</Correct>
                    </Rule>
                    <Rule>
                        <p>» თუ ზმნა იმავე ხმოვნით იწყება, რომლითაც ზმნისწინი მთავრდება, მაშინ ზმნის ფორმაში ორი ერთნაირი ბგერა მოიყრის თავს:</p>
                        <Correct>გ<span className="font-bold text-sky-600">აა</span>კეთა, გ<span className="font-bold text-sky-600">აა</span>დვილდა, დ<span className="font-bold text-sky-600">აა</span>რსდა, შ<span className="font-bold text-sky-600">ეე</span>რთდა, მ<span className="font-bold text-sky-600">ოო</span>ქროვდა... შეიძლება, თავი სამმა ერთნაირმა ბგერამაც მოიყაროს: გ<span className="font-bold text-sky-600">ააა</span>დვილ<span className="font-bold text-sky-600">ა</span>, გ<span className="font-bold text-sky-600">ააა</span>ნალიზა...</Correct>
                    </Rule>
                    <Rule>
                        <p>» სიტყვის გადატანისას უმჯობესია ფორმა ზმნისწინთან გაიყოს:</p>
                        <Correct><span className="font-mono bg-slate-200 px-2 py-1 rounded">შე-სრულდა</span>, <span className="font-mono bg-slate-200 px-2 py-1 rounded">გადა-გდება</span>, <span className="font-mono bg-slate-200 px-2 py-1 rounded">გადმო-ყვანა...</span></Correct>
                    </Rule>
                </Card>
            );
        };

        // --- Component: Header ---
        const Header = () => {
            return (
                <header className="text-center my-8 sm:my-12">
                    <h1 className="text-4xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-500 to-indigo-600">
                        ზმნისწინი
                    </h1>
                    <p className="text-lg text-slate-500 mt-2">ვიზუალური სახელმძღვანელო მოსწავლეებისთვის</p>
                </header>
            );
        };

        // --- Component: MemorizationTable ---
        const MemorizationTable = () => {
            const tableData = [
                { incorrect: 'ავღნიშნავ\nავღწერ', correct: 'აღვნიშნავ, აღვნიშნე, აღვნიშნოთ... (აღვ...)\nაღვწერ, აღვწერე, აღვწეროთ... (აღვ...)' },
                { incorrect: 'ავღზარდე', correct: 'აღვზარდე, აღვზარდოთ...' },
                { incorrect: 'ღზრდის', correct: 'ზრდის ან აღზრდის' },
                { incorrect: 'გამანთავისუფლეთ', correct: 'განმათავისუფლეთ ან გამათავისუფლეთ...\nგამათავისუფლოთ ან განმათავისუფლოთ...' },
                { incorrect: 'ანზოგადებს', correct: 'აზოგადებს, განაზოგადებს... განვაზოგადებ...' },
                { incorrect: 'ანვითარებს', correct: 'ავითარებს, განავითარებს, განვავითარებ...' },
                { incorrect: 'არდგენს', correct: 'წარადგენს, წარვადგენ... წარმოგიდგენთ, წარვუდგენ...' },
                { incorrect: 'ანსხვავებს', correct: 'ასხვავებს ან განასხვავებს, განვასხვავებ, განმისხვავებია...' },
                { incorrect: 'ანცალკევებს', correct: 'აცალკევებს, განაცალკევებს, განვაცალკევებ...' },
                { incorrect: 'ანხორციელებს', correct: 'ახორციელებს / განახორციელებს, განვახორციელებთ... გასახორციელებელი / განსახორციელებელი' },
                { incorrect: 'ანახლებს', correct: 'აახლებს / განაახლებს, განუახლებია... განაახლა...' },
                { incorrect: 'ანსიხიერებს', correct: 'ასახიერებს / განასახიერებს, განასახიერა (როლი)' },
            ];
            const MultiLineCellContent = ({ text }) => (
                <React.Fragment>
                    {text.split('\n').map((line, index) => (
                        <p key={index} className={text.split('\n').length > 1 && index < text.split('\n').length - 1 ? 'pb-2' : ''}>{line}</p>
                    ))}
                </React.Fragment>
            );
            return (
                <Card title="დაიმახსოვრეთ">
                    <div className="overflow-x-auto">
                        <table className="min-w-full w-full border-collapse text-left">
                            <thead >
                                <tr >
                                    <th className="p-3 text-lg font-bold text-slate-600 bg-slate-100 border-b-2 border-slate-300">
                                        არასწორი ფორმები
                                    </th>
                                    <th className="p-3 text-lg font-bold text-slate-600 bg-slate-100 border-b-2 border-slate-300">
                                        სწორი ფორმები
                                    </th>
                                </tr>
                            </thead>
                            <tbody className="text-slate-800">
                                {tableData.map((row, index) => (
                                    <tr key={index} className="border-b border-dotted border-slate-300 last:border-b-0">
                                        <td className="p-3 align-top">
                                            <MultiLineCellContent text={row.incorrect} />
                                        </td>
                                        <td className="p-3 align-top">
                                            <MultiLineCellContent text={row.correct} />
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </Card>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const functions = [
                { icon: <ArrowRightLeftIcon />, title: "1. უჩვენებს მიმართულებას", description: "მიდის, მოდის, შედის, გადის, გადადის, გადმოდის...);" },
                { icon: <CalendarPlusIcon />, title: "2. აწარმოებს მომავალ დროს", description: "(წერს – დაწერს, ხატავს – დახატავს, აკეთებს – გააკეთებს...);" },
                { icon: <CheckCircleIcon />, title: "3. მოქმედებას დასრულებული სახით წარმოადგენს", description: "(წერა – დაწერა, აკეთა – გააკეთა...);" },
                { icon: <ShuffleIcon />, title: "4. უცვლის ზმნას მნიშვნელობას", description: "(მოიგო, წააგო, გაიგო, დაიგო, ჩააგო... შეხვდა, მიხვდა, მოხვდა...)." }
            ];

            return (
                <div className="bg-slate-50 min-h-screen text-slate-800 p-4 sm:p-8">
                    <div className="max-w-4xl mx-auto">
                        <Header />

                        <Card title="რა არის ზმნისწინი?">
                            <p className="text-lg leading-relaxed">
                                ზმნისწინი არის ზმნის წინა ნაწილი, რომელიც დაერთვის ზმნას და მას გარკვეულ შინაარსს ანიჭებს. ზმნისწინს ქართულში ოთხი ფუნქცია აქვს:
                            </p>
                        </Card>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            {functions.map((func, index) => (
                                <FunctionCard key={index} icon={func.icon} title={func.title} description={func.description} />
                            ))}
                        </div>

                        <Card title="ზმნისწინების სახეობები">
                            <p className="mb-6 text-lg">ქართულ ენაში 15 ზმნისწინია:</p>
                            <div className="flex flex-wrap gap-3 justify-center bg-slate-100 p-4 rounded-lg mb-8">
                                {['მი', 'მო', 'ა', 'და', 'ჩა', 'შე', 'გა', 'წა', 'გადა', 'ამო', 'ჩამო', 'შემო', 'გამო', 'გადმო', 'წამო'].map(p => (
                                    <span key={p} className="bg-sky-500 text-white font-bold py-2 px-4 rounded-full shadow-md text-lg">{p}</span>
                                ))}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <h3 className="font-bold text-xl mb-4 text-slate-700">შედგენილობის მიხედვით</h3>
