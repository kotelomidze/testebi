"wrong": "XIX საუკუნის თბილისში ახლანდელ თავისუფლების მოედანზე, მდგარა ამიერკავკასიაში პირველი საოპერო თეატრი, რაც იმდროინდელი კულტურული ცხოვრების ცენტრს წარმოადგენდა. 1874 წელს თეატრის შენობა ხანძარს ისე გაუნადგურებია რომ მისი აღდგენა შეუძლებელი გამხდარა. შენობის გარეშე დარჩენილ ოპერის დასს, რომელსაც თავისი საქმიანობა არ შეუჩერებია, თბილისის საზოგადოებას საინტერესო დადგმებს სთავაზობდა. ქალაქის მესვეურებს თეატრისათვის ახალი შენობის აგება გადაუწყვიტავთ. პროექტი შეუქმნია გერმანელ არქიტექტორს ვიქტორ შრეტერს. მშენებლობა 1896 წელს დასრულებულა. ოპერის თეატრის შენობა, რომელიც რუსთაველის გამზირზე დგას დღესაც ქალაქის ერთ-ერთი ღირსშესანიშნაობაა. მას გამორჩეულ იერს აძლევს აღმოსავლური არქიტექტურისათვის დამახასიათებელი ელემენტების ერთობლიობა. კედლები გაფორმებულია მუქი და ღია ფერის ჰორიზონტალური ზოლებით, მრავალი ორნამენტებითა და ჩუქურთმებით. ინტერიერს ამშვენებს მოხატული ჭერი, ვიტრაჟები და მდიდრული ჭაღები. სამწუხაროთ 1973 წელს ამ შენობასაც ხანძარი გაუჩნდა და საფუძვლიანი რესტავრაცია დაჭირდა მაგრამ არქიტექტორებმა შეძლეს მისი თავდაპირველი სტილის შენარჩუნება. ამავე დროს მოახდინეს სცენისა და მაყურებელთა დარბაზის გადიდება. ხელოვნებით დაინტერესებული ადამიანებისათვის ოპერისა და ბალეტის თეატრი მრავალ-მხრივ საინტერესო და მიმზიდველი ადგილია."
}
].filter(t => !LIT_HID("red:" + t.n));

        const App = () => {
            const [fullName, setFullName] = useState(LIT_NAME);
            const [isStarted, setIsStarted] = useState(!!LIT_NAME);
            const [taskN, setTaskN] = useState(null);
            const [mode, setMode] = useState('full');   // 'full' | 'sent'
            const [answers, setAnswers] = useState([]);
            const [studentText, setStudentText] = useState('');
            const [idx, setIdx] = useState(0);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [status, setStatus] = useState('idle');
            const [done, setDone] = useState([]);
            const boxRef = useRef(null);

            const getSents = (text) => {
                const m = text.match(/[^.!?\n]+[.!?]?/g);
                return (m || []).map(s => s.trim()).filter(s => s.length > 0);
            };

            const task = TASKS.find(t => t.n === taskN) || null;
            const sents = task ? getSents(task.wrong) : [];
            const total = sents.length;
            const edited = task && (mode === 'sent'
                ? answers.some((a, i) => a !== sents[i])
                : studentText !== task.wrong);
            const last = idx === total - 1;

            useEffect(() => {
                const warn = (e) => {
                    /* ნამუშევარი ინახება — გაფრთხილება აღარ არის საჭირო */
                };
                window.addEventListener('beforeunload', warn);
                return () => window.removeEventListener('beforeunload', warn);
            }, [edited, status]);

            useEffect(() => {
                if (mode === 'sent' && boxRef.current) {
                    boxRef.current.style.height = 'auto';
                    boxRef.current.style.height = Math.max(120, boxRef.current.scrollHeight) + 'px';
                }
            }, [idx, answers, taskN, mode]);

            // მოსწავლის ნამუშევარი ინახება ტელეფონში (დახურვის შემდეგაც), სანამ თვითონ არ გაასუფთავებს
            const saveKey = (n) => 'lit-red:' + LIT_NAME + ':' + n;
            const loadSaved = (n) => { try { return JSON.parse(localStorage.getItem(saveKey(n)) || 'null'); } catch (e) { return null; } };
            const openTask = (t) => {
                const sv = loadSaved(t.n);
                setTaskN(t.n);
                setAnswers(sv && Array.isArray(sv.answers) ? sv.answers : getSents(t.wrong));
                setStudentText(sv && typeof sv.text === 'string' ? sv.text : t.wrong);
                setIdx(0);
                setStatus('idle');
            };
            // „ყველა დავალებიდან“: redaqtireba.html#n=5 — პირდაპირ ეს დავალება იხსნება
            useEffect(() => {
                const m = location.hash.match(/^#n=(\d+)$/);
                const t = m && TASKS.find(x => x.n === +m[1]);
                if (t) openTask(t);
            }, []);

            const backToList = () => {   // ნამუშევარი შენახულია, ამიტომ გაფრთხილება აღარ სჭირდება
                setTaskN(null);
                setStatus('idle');
            };
            useEffect(() => {
                if (!task) return;
                try {
                    if (edited) localStorage.setItem(saveKey(task.n), JSON.stringify({ text: studentText, answers: answers }));
                    else localStorage.removeItem(saveKey(task.n));
                } catch (e) {}
            }, [studentText, answers, taskN]);
            const clearTask = () => {
                if (!window.confirm('ამ დავალების ჩასწორებები წაიშლება და ტექსტი თავდაპირველ სახეს დაუბრუნდება. გავასუფთავო?')) return;
                try { localStorage.removeItem(saveKey(task.n)); } catch (e) {}
                setStudentText(task.wrong); setAnswers(getSents(task.wrong)); setIdx(0);
            };

            const setAnswer = (v) => {
                setAnswers(prev => prev.map((a, i) => i === idx ? v : a));
            };

            const handleStart = (e) => {
                e.preventDefault();
                if (!fullName.trim()) return;
                setIsStarted(true);
            };

            const handleSubmit = async () => {
                if (!window.confirm('გავაგზავნოთ ნამუშევარი? გაგზავნის შემდეგ შეცვლა ვეღარ მოხერხდება.')) return;

                setIsSubmitting(true);
                setStatus('idle');

                const payload = JSON.stringify(mode === 'sent'
                    ? { name: fullName, n: String(task.n), id: task.id, answers: answers }
                    : { name: fullName, n: String(task.n), id: task.id, text: studentText });

                const opts = {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: payload
                };

                const succeed = () => {
                    setStatus('success');
                    setDone(prev => prev.includes(task.n) ? prev : [...prev, task.n]);
                };

                try {
                    const res = await fetch(SERVER_URL, opts);
                    if (!res.ok) throw new Error('bad status');
                    succeed();
                } catch (err) {
                    try {
                        await fetch(SERVER_URL, Object.assign({ mode: 'no-cors' }, opts));
                        succeed();
                    } catch (err2) {
                        setStatus('error');
                    }
                } finally {
                    setIsSubmitting(false);
                }
            };

            /* ---------- 1. სახელი ---------- */
            if (!isStarted) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-sm w-full bg-white shadow-xl rounded-2xl p-7 sm:p-8 border border-slate-100 text-center space-y-6">
                            <div className="space-y-1.5">
                                <h1 className="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight">დავალება</h1>
                                <p className="text-sm text-slate-500">ჩაწერეთ სახელი და გვარი დასაწყებად</p>
                            </div>
                            <form onSubmit={handleStart} className="space-y-4 text-left">
                                <div className="space-y-1.5">
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider">სახელი და გვარი</label>
                                    <input
                                        type="text" autoFocus required
                                        className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all text-base"
                                        value={fullName}
                                        onChange={(e) => setFullName(e.target.value)}
                                    />
                                </div>
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-base shadow-md transition-all active:scale-95">დაწყება</button>
                            </form>
                        </div>
                    </div>
                );
            }

            /* ---------- 2. დავალების არჩევა ---------- */
            if (!task) {
                return (
                    <div className="min-h-screen p-4 sm:p-8 flex flex-col items-center">
                        <header className="max-w-4xl w-full mb-6 sm:mb-8 flex flex-col sm:flex-row items-center justify-between gap-3">
                            <div className="text-center sm:text-left">
                                <h1 className="text-xl sm:text-2xl font-bold text-slate-800">აირჩიეთ დავალება</h1>
                                <p className="text-slate-500 text-sm sm:text-base">სულ {TASKS.length} დავალებაა</p>
                            </div>
                            <div className="bg-white px-5 py-2.5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                                <div className="w-2 h-2 rounded-full bg-green-500"></div>
                                <span className="font-semibold text-slate-700">{fullName}</span>
                            </div>
                        </header>

                        <main className="max-w-4xl w-full bg-white shadow-2xl rounded-3xl border border-slate-100 p-4 sm:p-8 space-y-6">
                            <div className="space-y-2">
                                <span className="block text-xs font-bold text-slate-500 uppercase tracking-wider">რეჟიმი</span>
                                <div className="flex gap-2 p-1 bg-slate-50 border border-slate-100 rounded-2xl">
                                    <button
                                        type="button"
                                        onClick={() => setMode('full')}
                                        className={`flex-1 px-3 py-2.5 rounded-xl text-sm font-bold transition-all active:scale-95 ${mode === 'full' ? 'bg-white text-indigo-600 shadow-sm border border-slate-100' : 'text-slate-500 hover:text-slate-700'}`}
                                    >მთლიანი ტექსტი</button>
                                    <button
                                        type="button"
                                        onClick={() => setMode('sent')}
                                        className={`flex-1 px-3 py-2.5 rounded-xl text-sm font-bold transition-all active:scale-95 ${mode === 'sent' ? 'bg-white text-indigo-600 shadow-sm border border-slate-100' : 'text-slate-500 hover:text-slate-700'}`}
                                    >წინადადებებად</button>
                                </div>
                                <p className="text-xs text-slate-400">
                                    {mode === 'full'
                                        ? 'ტექსტი მთლიანად გამოჩნდება და ერთდროულად ჩაასწორებთ.'
                                        : 'წინადადებები ერთმანეთის მიყოლებით გამოჩნდება.'}
                                </p>
                            </div>

                            <div className="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2.5 sm:gap-3">
                                {TASKS.map(t => {
                                    const finished = done.includes(t.n);
                                    return (
                                        <button
                                            key={t.n}
                                            onClick={() => openTask(t)}
                                            className={`aspect-square rounded-2xl border-2 flex items-center justify-center transition-all active:scale-95 outline-none focus-visible:ring-4 focus-visible:ring-indigo-100 ${finished ? 'border-green-300 bg-green-50 text-green-700' : 'border-slate-100 bg-slate-50 text-slate-700 hover:border-indigo-500 hover:bg-white hover:text-indigo-600'}`}
                                        >
                                            <span className="text-lg sm:text-xl font-bold">{t.n}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </main>
                        <footer className="mt-8 text-slate-400 text-sm">© {new Date().getFullYear()} </footer>
                    </div>
                );
            }

            /* ---------- 3. გაგზავნილია ---------- */
            if (status === 'success') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-sm w-full bg-white shadow-xl rounded-2xl p-8 border border-slate-100 text-center space-y-5">
                            <div className="w-14 h-14 mx-auto rounded-full bg-green-50 border-2 border-green-100 flex items-center justify-center text-green-600 text-2xl font-bold">✓</div>
                            <div className="space-y-1">
                                <h2 className="text-xl font-bold text-slate-800">ნამუშევარი გაიგზავნა</h2>
                                <p className="text-sm text-slate-500">დავალება {task.n} · {mode === 'sent' ? total + ' წინადადება' : 'მთლიანი ტექსტი'}</p>
                            </div>
                            <button
                                onClick={() => { setTaskN(null); setStatus('idle'); }}
                                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition-all active:scale-95"
                            >სხვა დავალების არჩევა</button>
                        </div>
                    </div>
                );
            }

            /* ---------- 4. მთლიანი ტექსტის რედაქტორი ---------- */
            if (mode === 'full') {
                return (
                    <div className="min-h-screen p-4 sm:p-8 flex flex-col items-center">
                        <header className="max-w-4xl w-full mb-5 flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                                <button
                                    onClick={backToList}
                                    className="shrink-0 bg-white px-3 sm:px-4 py-2.5 rounded-2xl shadow-sm border border-slate-100 font-bold text-slate-600 hover:text-indigo-600 hover:border-indigo-200 transition-all active:scale-95"
                                >← სია</button>
                            <button onClick={clearTask} className="shrink-0 bg-white px-3 py-2.5 rounded-2xl shadow-sm border border-slate-100 font-bold text-slate-500 text-sm">გასუფთავება</button>
                                <h1 className="text-lg sm:text-xl font-bold text-slate-800 truncate">დავალება {task.n}</h1>
                            </div>
                            <div className="hidden sm:flex bg-white px-5 py-2.5 rounded-2xl shadow-sm border border-slate-100 items-center gap-3 shrink-0">
                                <div className="w-2 h-2 rounded-full bg-green-500"></div>
                                <span className="font-semibold text-slate-700">{fullName}</span>
                            </div>
                        </header>

                        <main className="max-w-4xl w-full bg-white shadow-2xl rounded-3xl border border-slate-100 p-4 sm:p-8 space-y-5">
                            <div className="flex justify-between items-baseline">
                                <span className="text-xs sm:text-sm font-bold text-slate-600 uppercase tracking-wider">სარედაქტირებელი ტექსტი</span>
                                <span className="text-xs text-slate-400 italic">ჩაასწორეთ პირდაპირ აქ</span>
                            </div>

                            <textarea
                                spellCheck={false}
                                style={{ maxWidth: '68ch', margin: '0 auto' }}
                                className="editor block w-full h-[58vh] min-h-[300px] max-h-[680px] p-4 sm:p-6 border-2 border-slate-100 rounded-2xl bg-slate-50 focus:bg-white text-base sm:text-lg text-slate-800 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all resize-none shadow-inner"
                                value={studentText}
                                onChange={(e) => setStudentText(e.target.value)}
                            />

                            {status === 'error' && (
                                <div className="p-4 bg-red-50 text-red-800 rounded-xl border-2 border-red-100 text-center font-bold animate-shake">
                                    გაგზავნა ვერ მოხერხდა. შეამოწმეთ ინტერნეტი და სცადეთ თავიდან.
                                </div>
                            )}

                            <div className="flex justify-center pt-2 border-t border-slate-100">
                                <button
                                    type="button"
                                    onClick={handleSubmit}
                                    disabled={isSubmitting}
                                    className={`w-full sm:w-auto px-10 sm:px-16 py-3.5 rounded-2xl font-bold text-lg shadow-lg transition-all active:scale-95 ${isSubmitting ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}
                                >{isSubmitting ? 'იგზავნება...' : 'ნამუშევრის გაგზავნა'}</button>
                            </div>
                        </main>
                        <footer className="mt-8 text-slate-400 text-sm">© {new Date().getFullYear()} </footer>
                    </div>
                );
            }

            /* ---------- 4. წინადადებების რედაქტორი ---------- */
            const pct = Math.round(((idx + 1) / total) * 100);

            return (
                <div className="min-h-screen p-4 sm:p-8 flex flex-col items-center">
                    <header className="max-w-3xl w-full mb-5 flex items-center justify-between gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                            <button
                                onClick={backToList}
                                className="shrink-0 bg-white px-3 sm:px-4 py-2.5 rounded-2xl shadow-sm border border-slate-100 font-bold text-slate-600 hover:text-indigo-600 hover:border-indigo-200 transition-all active:scale-95"
                            >← სია</button>
                        <button onClick={clearTask} className="shrink-0 bg-white px-3 py-2.5 rounded-2xl shadow-sm border border-slate-100 font-bold text-slate-500 text-sm">გასუფთავება</button>
                            <h1 className="text-lg sm:text-xl font-bold text-slate-800 truncate">დავალება {task.n}</h1>
                        </div>
                        <div className="hidden sm:flex bg-white px-5 py-2.5 rounded-2xl shadow-sm border border-slate-100 items-center gap-3 shrink-0">
                            <div className="w-2 h-2 rounded-full bg-green-500"></div>
                            <span className="font-semibold text-slate-700">{fullName}</span>
                        </div>
                    </header>

                    <main className="max-w-3xl w-full bg-white shadow-2xl rounded-3xl border border-slate-100 p-4 sm:p-8 space-y-5">
                        <div className="space-y-2">
                            <div className="flex justify-between items-baseline">
                                <span className="text-xs sm:text-sm font-bold text-slate-600 uppercase tracking-wider">წინადადება {idx + 1} / {total}</span>
                                <span className="text-xs text-slate-400 italic">ჩაასწორეთ და გადადით შემდეგზე</span>
                            </div>
                            <div className="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                                <div className="h-full bg-indigo-500 rounded-full transition-all" style={{ width: pct + '%' }}></div>
                            </div>
                        </div>

                        {idx > 0 && (
                            <p className="text-sm text-slate-400 leading-relaxed border-l-2 border-slate-100 pl-3">
                                {answers[idx - 1]}
                            </p>
                        )}

                        <textarea
                            ref={boxRef}
                            spellCheck={false}
                            className="editor w-full p-4 sm:p-5 border-2 border-slate-100 rounded-2xl bg-slate-50 focus:bg-white text-base sm:text-lg text-slate-800 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all resize-none shadow-inner overflow-hidden"
                            value={answers[idx] || ''}
                            onChange={(e) => setAnswer(e.target.value)}
                        />

                        {status === 'error' && (
                            <div className="p-4 bg-red-50 text-red-800 rounded-xl border-2 border-red-100 text-center font-bold animate-shake">
                                გაგზავნა ვერ მოხერხდა. შეამოწმეთ ინტერნეტი და სცადეთ თავიდან.
                            </div>
                        )}

                        <div className="flex items-center gap-3">
                            <button
                                type="button"
                                onClick={() => setIdx(i => Math.max(0, i - 1))}
                                disabled={idx === 0}
                                className={`px-5 py-3 rounded-2xl font-bold transition-all active:scale-95 ${idx === 0 ? 'bg-slate-100 text-slate-300 cursor-not-allowed' : 'bg-white border-2 border-slate-100 text-slate-600 hover:border-indigo-200 hover:text-indigo-600'}`}
                            >← წინა</button>

                            {last ? (
                                <button
                                    type="button"
                                    onClick={handleSubmit}
                                    disabled={isSubmitting}
                                    className={`flex-1 px-6 py-3 rounded-2xl font-bold text-lg shadow-lg transition-all active:scale-95 ${isSubmitting ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}
                                >{isSubmitting ? 'იგზავნება...' : 'ნამუშევრის გაგზავნა'}</button>
                            ) : (
                                <button
                                    type="button"
                                    onClick={() => setIdx(i => Math.min(total - 1, i + 1))}
                                    className="flex-1 px-6 py-3 rounded-2xl font-bold text-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg transition-all active:scale-95"
                                >შემდეგი →</button>
                            )}
                        </div>

                        <div className="flex flex-wrap gap-1.5 pt-4 border-t border-slate-100">
                            {sents.map((s, i) => {
                                const changed = answers[i] !== s;
                                const current = i === idx;
                                return (
                                    <button
                                        key={i}
                                        type="button"
                                        onClick={() => setIdx(i)}
                                        title={'წინადადება ' + (i + 1)}
                                        className={`w-8 h-8 rounded-lg text-xs font-bold transition-all active:scale-95 ${current ? 'bg-indigo-600 text-white' : changed ? 'bg-indigo-50 text-indigo-600 border border-indigo-200' : 'bg-slate-50 text-slate-400 border border-slate-100 hover:border-indigo-200'}`}
                                    >{i + 1}</button>
                                );
                            })}
                        </div>
                    </main>
                    <footer className="mt-8 text-slate-400 text-sm">© {new Date().getFullYear()} </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
